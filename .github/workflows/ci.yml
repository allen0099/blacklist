name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Cross-compile
        run: |
          for GOOS in darwin windows; do GOOS=$GOOS go build ./...; done

      - name: Test with coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold (90%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "Total coverage: ${COVERAGE}%"
          awk -v c="$COVERAGE" 'BEGIN { exit !(c >= 90) }' || { echo "Coverage below 90%"; exit 1; }

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
